services:
  postgres:
    image: postgres:16-alpine
    container_name: native-location-postgres
    restart: unless-stopped
    ports:
      - '16875:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nativelocation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nativelocation}
      POSTGRES_DB: ${POSTGRES_DB:-nativelocation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-nativelocation} -d ${POSTGRES_DB:-nativelocation}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
