services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-16875}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 18156
      API_KEY: ${API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      APK_BUILD_AGENT_URL: ${APK_BUILD_AGENT_URL:-http://host.docker.internal:18210}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./deploy/apk:/app/deploy/apk
    ports:
      - '0.0.0.0:18156:18156'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_HTTP_URL: ${EXPO_PUBLIC_API_HTTP_URL}
        EXPO_PUBLIC_API_WS_URL: ${EXPO_PUBLIC_API_WS_URL}
        EXPO_PUBLIC_API_KEY: ${EXPO_PUBLIC_API_KEY}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '0.0.0.0:${WEB_PORT:-28881}:28881'
    volumes:
      - ./deploy/apk:/apk:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '0.0.0.0:18200:18200'
      - '0.0.0.0:18201:18201'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
    profiles:
      - tls

volumes:
  postgres_data:
