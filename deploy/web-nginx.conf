# Mobile Web 静态站（Compose web 服务挂载为 default.conf）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_expo/static/ {
        include /etc/nginx/mime.types;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/mime.types;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
